# Pages the weekly check reads. Edit this file to add or retire conferences.
#
# For each conference:
#   id:         short unique name, e.g. bps-2027 (used to avoid adding the same match twice)
#   conference: the name shown on the website
#   start/end:  YYYY-MM-DD if known (leave blank if not announced; the reviewer fills it in)
#   city/country
#   urls:       program, schedule or invited-speaker pages (HTML or PDF). Several are fine.
#   enabled:    false to skip without deleting
#   ignore:     [professor-id, ...] to stop re-suggesting a match you rejected
#
# Once a year: when a conference's next edition gets a website, copy its block,
# change the id/year/dates, and point urls at the new speaker page.
# The check reports broken or empty URLs in the weekly pull request.

