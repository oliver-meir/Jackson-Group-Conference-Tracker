# Runs the checker's tests whenever someone changes the code or the data,
# so a typo in tracker.json or watchlist.yaml is caught before it is merged.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Check data files parse
        run: python -c "import json,yaml; json.load(open('data/tracker.json')); yaml.safe_load(open('watchlist.yaml')); print('data ok')"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Test the helper service
        run: node tests/worker/worker.test.mjs
