# Every Monday morning (Canberra time) this reads the pages in watchlist.yaml, looks for every
# tracked professor, and saves any new hits to the tracker as "Unverified".
# Review them on the website with Confirm / Remove. No AI or paid service is used.
name: Weekly conference check

on:
  schedule:
    - cron: "0 21 * * 0"   # 21:00 UTC Sunday = Monday 7-8am in Canberra
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Check conference pages
        run: python scripts/check_watchlist.py
      - name: Show report
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save results
        run: bash scripts/save_results.sh "Weekly conference check results"
