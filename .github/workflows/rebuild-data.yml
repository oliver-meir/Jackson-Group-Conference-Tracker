# When data/tracker.json changes (a change saved from the website through the helper service,
# or a file uploaded by hand), this rebuilds tracker.js, the calendar and the map
# coordinates, and commits them. Nobody needs to run Python by hand.
name: Rebuild website data

on:
  push:
    branches: [main]
    paths:
      - data/tracker.json
      - data/conferences.json
      - watchlist.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check tracker.json is valid
        run: python -c "import json; d=json.load(open('data/tracker.json')); assert 'profs' in d and 'apps' in d; print(len(d['apps']), 'appearances')"
      - run: python scripts/build_outputs.py
      - name: Commit rebuilt files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add data/tracker.js data/talks.ics data/geocache.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Rebuild website data"
            git push -q origin HEAD:main && exit 0
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/build_outputs.py
          done
          exit 1
