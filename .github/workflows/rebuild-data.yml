# When someone edits or uploads data/tracker.json (for example the file saved with the
# website's "Export data" button), this rebuilds tracker.js, the calendar and the map
# coordinates, and commits them. Nobody needs to run Python by hand.
name: Rebuild website data

on:
  push:
    branches: [main]
    paths:
      - data/tracker.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check tracker.json is valid
        run: python -c "import json; d=json.load(open('data/tracker.json')); assert 'profs' in d and 'apps' in d; print(len(d['apps']), 'appearances')"
      - run: python scripts/build_outputs.py
      - name: Commit rebuilt files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracker.js data/talks.ics data/geocache.json
          git diff --cached --quiet || (git commit -m "Rebuild website data" && git push)
